services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sandbox-server-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: terminal_server
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for Celery)
  redis:
    image: redis:7-alpine
    container_name: sandbox-server-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandbox-server-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/terminal_server
      - REDIS_URL=redis://redis:6379/0
      - API_HOST=0.0.0.0
      - API_PORT=8000
      # API_BASE_URL must be externally reachable
      - API_BASE_URL=${API_BASE_URL:-https://terminal.newsml.io}
      - WEB_BASE_URL=http://web-server:8001
      - LOG_LEVEL=INFO
      - LOCALTUNNEL_HOST=https://localtunnel.newsml.io
      - USE_GVISOR=${USE_GVISOR}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      # Container platform configuration
      - CONTAINER_PLATFORM=${CONTAINER_PLATFORM:-docker}
      - SANDBOX_BASE_IMAGE=${SANDBOX_BASE_IMAGE:-terminal-server:latest}
      # Kubernetes/GKE configuration
      - K8S_NAMESPACE=${K8S_NAMESPACE:-default}
      - K8S_IN_CLUSTER=${K8S_IN_CLUSTER:-false}
      - GKE_AUTOPILOT_ENABLED=${GKE_AUTOPILOT_ENABLED:-false}
      # GPU configuration
      - GPU_ENABLED=${GPU_ENABLED:-false}
      - GPU_TYPE=${GPU_TYPE:-nvidia-l4}
      - GPU_COUNT=${GPU_COUNT:-1}
      - GPU_TERMINAL_IMAGE=${GPU_TERMINAL_IMAGE:-}
      # Warm pool configuration
      - WARM_POOL_ENABLED=${WARM_POOL_ENABLED:-true}
      - WARM_POOL_SIZE=${WARM_POOL_SIZE:-2}
      - WARM_POOL_GPU_SIZE=${WARM_POOL_GPU_SIZE:-0}
      # GCP configuration
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GCP_REGION=${GCP_REGION:-us-central1}
      - KUBECONFIG=/root/.kube/config
      - CLOUDSDK_CONFIG=/root/.config/gcloud
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./src:/app/src
      - ./containers/base:/app/containers/base
      - /home/jupyter/.kube:/root/.kube:ro
      - ${HOST_GCLOUD_DIR:-${HOME}/.config/gcloud}:/root/.config/gcloud
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.api_server:app --host 0.0.0.0 --port 8000 --reload

  # Web Server
  web-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandbox-server-web
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/terminal_server
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8001
      - API_BASE_URL=https://terminal.newsml.io
      - LOG_LEVEL=INFO
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn src.web_server:app --host 0.0.0.0 --port 8001 --reload

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandbox-server-celery
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/terminal_server
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - LOCALTUNNEL_HOST=https://localtunnel.newsml.io
      - USE_GVISOR=${USE_GVISOR}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      - CONTAINER_PLATFORM=${CONTAINER_PLATFORM:-docker}
      - SANDBOX_BASE_IMAGE=${SANDBOX_BASE_IMAGE:-terminal-server:latest}
      - K8S_NAMESPACE=${K8S_NAMESPACE:-default}
      - K8S_IN_CLUSTER=${K8S_IN_CLUSTER:-false}
      - GKE_AUTOPILOT_ENABLED=${GKE_AUTOPILOT_ENABLED:-false}
      - GPU_ENABLED=${GPU_ENABLED:-false}
      - GPU_TYPE=${GPU_TYPE:-nvidia-l4}
      - GPU_COUNT=${GPU_COUNT:-1}
      - KUBECONFIG=/root/.kube/config
      - CLOUDSDK_CONFIG=/root/.config/gcloud
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./src:/app/src
      - ./containers/base:/app/containers/base
      - ${HOST_KUBE_DIR:-${HOME}/.kube}:/root/.kube:ro
      - ${HOST_GCLOUD_DIR:-${HOME}/.config/gcloud}:/root/.config/gcloud
    depends_on:
      - api-server
      - postgres
      - redis
    command: celery -A src.celery_app worker --loglevel=info

  # Celery Beat
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandbox-server-celery-beat
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/terminal_server
      - REDIS_URL=redis://redis:6379/0
      - CONTAINER_PLATFORM=${CONTAINER_PLATFORM:-docker}
      - LOG_LEVEL=INFO
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      - K8S_NAMESPACE=${K8S_NAMESPACE:-default}
      - K8S_IN_CLUSTER=${K8S_IN_CLUSTER:-false}
      - KUBECONFIG=/root/.kube/config
      - CLOUDSDK_CONFIG=/root/.config/gcloud
    volumes:
      - ./src:/app/src
      - ${HOST_KUBE_DIR:-${HOME}/.kube}:/root/.kube:ro
      - ${HOST_GCLOUD_DIR:-${HOME}/.config/gcloud}:/root/.config/gcloud
    depends_on:
      - api-server
      - postgres
      - redis
    command: celery -A src.celery_app beat --loglevel=info

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sandbox-server-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/letsencrypt:ro
    depends_on:
      - api-server
      - web-server

volumes:
  postgres_data:
